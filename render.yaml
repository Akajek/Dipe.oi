services:
  - type: web
    name: turretforge
    runtime: node
    region: frankfurt
    # Free tier: spins down after ~15 min idle, so the first player back waits
    # through a cold start. Change to `starter` once that becomes annoying.
    plan: free
    branch: main
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: TICK_RATE
        value: "30"
